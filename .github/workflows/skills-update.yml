# Opens a pull request when a skill installed from islomar/ai-office has a new version.
# Written by `ai-office write-workflow`; edit the template in ai-office, not this copy.
name: Update skills

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: skills-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRANCH: skills-update
      SKILLS_CLI: skills@1.7.6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check for skill updates
        id: check
        run: |
          if npx -y "$SKILLS_CLI" check; then
            echo "updates=false" >> "$GITHUB_OUTPUT"
          else
            echo "updates=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update skills and open a pull request
        if: steps.check.outputs.updates == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          npx -y "$SKILLS_CLI" update -p -y
          git add -A -- .agents .claude skills-lock.json
          if git diff --cached --quiet; then
            echo "check reported an update, but update changed no files"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git commit -m "Update skills from ai-office"
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number -q '.[].number')" ]; then
            gh pr create --base "$BASE" --head "$BRANCH" \
              --title "Update skills from ai-office" \
              --body "Skills installed from islomar/ai-office have new versions. Review the diff: a skill changes how agents work in this repository."
          fi

<!-- FastComments loads only when the visitor asks for the comments. -->
<h4 class="page__comments-title">{{ comments_label }}</h4>
<div id="comments-notice">
  <p>Comments are provided by FastComments, a third-party service. If you load them, your IP address goes to FastComments and it sets a cookie for 30 days. <a href="{{ '/cookies/' | relative_url }}">Cookie policy</a>.</p>
  <button type="button" class="btn btn--primary" id="comments-load">Load comments</button>
</div>
<div id="fastcomments-widget"></div>
<p>You can also reply by <a href="mailto:{{ site.email }}?subject={{ page.title | url_encode | replace: '+', '%20' }}">email</a>.</p>
<noscript>Please enable JavaScript to load the comments.</noscript>
<script>
  document.getElementById('comments-load').addEventListener('click', function () {
    var notice = document.getElementById('comments-notice');
    var script = document.createElement('script');
    script.src = 'https://cdn-eu.fastcomments.com/js/embed-v2.min.js';
    script.onload = function () {
      window.FastCommentsUI(document.getElementById('fastcomments-widget'), {
        tenantId: {{ site.comments.fastcomments.tenant_id | jsonify }},
        region: 'eu',
        urlId: {{ page.slug | jsonify }},
        url: {{ page.url | absolute_url | jsonify }},
        disableUnverifiedLabel: true
      });
    };
    script.onerror = function () { notice.hidden = false; };
    document.head.appendChild(script);
    notice.hidden = true;
  });
</script>
